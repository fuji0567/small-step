[project]
name = "otayori-ai-backend"
version = "0.1.0"
description = "Backend API for kindergarten growth and incident records"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14.0,<2.0.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "mcp>=2.0.0,<3.0.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2.0"]
backup-s3 = ["boto3>=1.35.0,<2.0.0"]
edge-audio = ["faster-whisper>=1.1.0,<2.0.0"]
speaker-diarization = ["pyannote.audio>=4.0.0,<5.0.0"]
dev = ["pytest>=8.3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
