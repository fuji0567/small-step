# Add this file only on a Sakura High Firepower VRT instance:
# docker compose -f compose.yaml -f compose.vrt.yaml up -d --build
services:
  small-step-vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.11.0}
    command:
      - --model
      - ${LLM_MODEL:-Qwen/Qwen3-32B}
      - --served-model-name
      - ${LLM_MODEL:-Qwen/Qwen3-32B}
      - --dtype
      - bfloat16
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-8192}
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION:-0.90}
      - --max-num-seqs
      - ${VLLM_MAX_NUM_SEQS:-4}
      - --disable-log-requests
    gpus: all
    ipc: host
    ports:
      - "127.0.0.1:8001:8000"
    networks:
      llm:
        aliases:
          - small-step-vllm
    volumes:
      - ${VLLM_MODEL_CACHE_DIR:-/mnt/small-step-cache/huggingface}:/root/.cache/huggingface
      - ${VLLM_COMPILE_CACHE_DIR:-/mnt/small-step-cache/vllm}:/root/.cache/vllm
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3); raise SystemExit(0 if response.status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 300s
    restart: unless-stopped

  api:
    environment:
      CLOUD_AUDIO_JOB_DIR: /var/lib/small-step/cloud-audio-jobs
    volumes:
      - cloud_audio_jobs:/var/lib/small-step/cloud-audio-jobs
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    build: .
    env_file:
      - .env
    command: ["python", "scripts/prepare_database.py"]
    volumes:
      - api_data:/app/data
    restart: "no"

  gpu-worker:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    env_file:
      - .env
    environment:
      CLOUD_AUDIO_JOB_DIR: /var/lib/small-step/cloud-audio-jobs
      HF_HOME: /var/lib/small-step/models/huggingface
    command: ["python3", "scripts/process_cloud_audio_jobs.py"]
    gpus: all
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - llm
    volumes:
      - api_data:/app/data
      - cloud_audio_jobs:/var/lib/small-step/cloud-audio-jobs
      - gpu_model_cache:/var/lib/small-step/models
    depends_on:
      api:
        condition: service_healthy
      small-step-vllm:
        condition: service_healthy
    restart: unless-stopped

  line-worker:
    build: .
    env_file:
      - .env
    command: ["python", "scripts/send_pending_line_notifications.py", "--watch"]
    volumes:
      - api_data:/app/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  database-tools:
    profiles:
      - operations
    build:
      context: .
      dockerfile: Dockerfile.database-tools
    env_file:
      - .env
    environment:
      DATABASE_BACKUP_DIR: /backups
      RESTORE_DATABASE_URL: postgresql+psycopg://postgres@restore-db:5432/small_step_restore
    networks:
      - default
      - database-recovery
    volumes:
      - ${DATABASE_BACKUP_HOST_DIR:-./data/database-backups}:/backups
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: "no"

  restore-db:
    profiles:
      - recovery
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: small_step_restore
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: postgres
      PGDATA: /var/lib/postgresql/data
    networks:
      - database-recovery
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d small_step_restore
      interval: 2s
      timeout: 3s
      retries: 15
    restart: "no"

volumes:
  cloud_audio_jobs:
  gpu_model_cache:

networks:
  llm:
    name: small-step-ai
    external: true
  database-recovery:
    internal: true
