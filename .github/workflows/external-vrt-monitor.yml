name: Small Step external VRT monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: small-step-external-vrt-monitor
  cancel-in-progress: false

jobs:
  check-vrt:
    if: vars.SMALL_STEP_EXTERNAL_MONITOR_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out monitoring code
        uses: actions/checkout@v7
      - name: Check VRT and update incident
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMALL_STEP_EXTERNAL_HEALTH_URL: ${{ secrets.SMALL_STEP_EXTERNAL_HEALTH_URL }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          OPERATIONS_ALERT_LINE_USER_ID: ${{ secrets.OPERATIONS_ALERT_LINE_USER_ID }}
        run: python3 scripts/monitor_external_health.py
